schema_version = 1
[experiment]
mode = "smoke"
identifier = "exp03"
title = "Schwarzschild interior smoke test"
equation_system = "vacuum"
[physics]
mass = 1.0
epsilon = 0.5
[initial_data]
family = "schwarzschild_interior"
[coordinates]
u_min = -1.0
u_max = -0.5
v_min = 0.0
v_max = 1.0
u_map = "affine"
v_map = "xi_v0"
u_breakpoints = [-1.0, -0.5]
v_breakpoints = [0.0, 1.0]
u_degrees = [16]
v_degrees = [16]
[angular]
construction = "spherical_symmetry"
point_count = 40
neighbor_count = 16
seed = 0
retained_degree = 0
work_degree = 1
differentiation_degree = 2
[solver]
maximum_sweeps = 3
tolerance = 1e-10
relaxation = 1.0
slab_direction = "none"
rk_substeps = 4
sdc_sweeps = 1
metric_substeps = 1
boundary_substeps = 4
stopping_norm = "maximum"
[projection]
nonlinear_products = "direct"
retained_projection = "spherical"
filter = "none"
filter_strength = 0.0
[audit]
coordinate_overgrid_increment = 4
angular_overgrid_degree = 0
sphere_point_count = 40
derivative_halo_u = 2
derivative_halo_v = 2
endpoint_mask_u = 2
endpoint_mask_v = 2
[output]
checkpoints = false
checkpoint_every = 1
save_residual_maps = true
save_figures = true
