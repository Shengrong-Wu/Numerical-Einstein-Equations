schema_version = 1
[experiment]
identifier = "exp08"
title = "Scalar trapped-section smoke test"
equation_system = "scalar_field"
[physics]
kappa = 0.25
delta = 0.1
v_max = 0.01
[initial_data]
scalar_amplitude = -2.0
profile_scale = 0.01
shear_amplitude = 0.1
