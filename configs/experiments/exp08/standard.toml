[audit]
coordinate_overgrid_increment = 4
angular_overgrid_degree = 3
sphere_point_count = 1000
derivative_halo_u = 3
derivative_halo_v = 3
endpoint_mask_u = 3
endpoint_mask_v = 3

[output]
checkpoints = false
checkpoint_every = 1
save_residual_maps = true
save_figures = true
