[angular]
construction = "fibonacci"
point_count = 90
neighbor_count = 32
seed = 0
retained_degree = 4
work_degree = 7
differentiation_degree = 8

[solver]
maximum_sweeps = 8
tolerance = 1e-8
relaxation = 1.0
slab_direction = "u"
rk_substeps = 4
sdc_sweeps = 1
metric_substeps = 4
boundary_substeps = 16
