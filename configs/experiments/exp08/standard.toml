schema_version = 1

[experiment]
identifier = "exp08"
title = "Scalar-pulse trapped region and apparent horizon"
equation_system = "scalar_field"

[physics]
kappa = 0.25
delta = 0.1
u_right = -0.05
v_max = 0.05
curved_constant = 0.1
curved_exponent = 1.0416666666666667
target_u = -0.4696271025
