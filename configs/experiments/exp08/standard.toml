support_u_rights = [-0.357134241489, -0.287027603206, -0.214476589230, -0.172374122545, -0.128803687816, -0.089484658624, -0.071918522434, -0.057800677796]

[coordinates]
u_min = -1.0
u_max = -0.05
v_min = 0.0
v_max = 0.05
u_map = "curved_inner_atlas_tau_negative_log"
v_map = "power_0.1"
u_breakpoints = [-1.0, -0.05]
v_breakpoints = [0.0, 0.05]
u_degrees = [8]
