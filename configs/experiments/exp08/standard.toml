atlas_tau_elements = [3, 3, 4, 5, 6, 8, 12]
atlas_s_elements = [3, 3, 3, 3, 3, 3, 4]
atlas_point_counts = [90, 170, 90, 90, 90, 90, 90]
atlas_retained_degrees = [4, 5, 4, 4, 4, 4, 4]
atlas_work_degrees = [7, 10, 7, 7, 7, 7, 7]
mots_anchor_u = -0.42
mots_standard_tau_elements = 3
mots_standard_s_elements = 3
mots_refined_tau_elements = 4
mots_refined_s_elements = 4
mots_point_count = 170
mots_retained_degree = 5
mots_work_degree = 10
mots_graph_degree = 5
horizon_graph_degree = 4
