[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-einstein-equations"
version = "0.1.0"
description = "Picard iteration for characteristic Einstein equations in double-null gauge"
requires-python = ">=3.12,<3.13"
authors = [{name = "Shengrong Wu"}]
dependencies = [
  "numpy==2.4.3",
  "scipy==1.16.3",
  "matplotlib==3.10.7",
  "pillow==12.2.0",
  "mpmath==1.3.0",
]

[project.scripts]
nee = "nee.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nee*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
